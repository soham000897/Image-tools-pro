<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{

padding:0;
box-sizing:border-box;
font-family:'Segoe UI',system-ui,-apple-system,sans-serif;

/* TOOL BOX */
.container{

<body>

<nav>
<a href="index.html">Home</a>
<a href="compressor.html">Compressor</a>
<a href="resizer.html">Resizer</a>
<a href="jpg-to-png.html">Converter</a>
</nav>

<section class="hero">
<h1>Image Compressor</h1>
<p>Reduce image size instantly while maintaining visual quality.</p>
</section>

<div class="container">

<div class="drop-area" id="dropArea">
Click or Drag & Drop Image Here
<input type="file" id="imageInput" accept="image/*">
</div>

<div class="range-box">
Compression Quality:
<strong><span id="qualityValue">0.7</span></strong>
<br>
<input type="range" id="qualitySlider" min="0.1" max="1" step="0.1" value="0.7">
</div>

<button id="compressBtn" onclick="compressImage()">Compress Image</button>

<div class="result" id="resultBox">
<p><strong>Original Size:</strong> <span id="originalSize"></span></p>
<p><strong>Compressed Size:</strong> <span id="compressedSize"></span></p>
<p><strong>Reduction:</strong> <span id="reduction"></span></p>
<div class="preview">
<img id="previewImage">
</div>
<a id="downloadLink" class="download">Download Image</a>
</div>

</div>

<footer>
© 2026 Pro Image Tools — Secure • Fast • Professional
</footer>

<script>
const dropArea=document.getElementById("dropArea");
const fileInput=document.getElementById("imageInput");
const slider=document.getElementById("qualitySlider");
const qualityValue=document.getElementById("qualityValue");
const compressBtn=document.getElementById("compressBtn");

let selectedFile;

dropArea.addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",(e)=>{
selectedFile=e.target.files[0];
});

dropArea.addEventListener("dragover",(e)=>{
e.preventDefault();
dropArea.classList.add("active");
});

dropArea.addEventListener("dragleave",()=>{
dropArea.classList.remove("active");
});

dropArea.addEventListener("drop",(e)=>{
e.preventDefault();
selectedFile=e.dataTransfer.files[0];
dropArea.classList.remove("active");
});

slider.addEventListener("input",()=>{
qualityValue.textContent=slider.value;
});

function compressImage(){

if(!selectedFile){
alert("Please upload an image first!");
return;
}

compressBtn.disabled=true;
compressBtn.textContent="Processing...";

let reader=new FileReader();
reader.readAsDataURL(selectedFile);

reader.onload=function(event){
let img=new Image();
img.src=event.target.result;

img.onload=function(){

let canvas=document.createElement("canvas");
let ctx=canvas.getContext("2d");

canvas.width=img.width;
canvas.height=img.height;

ctx.drawImage(img,0,0);

let compressedData=canvas.toDataURL("image/jpeg",slider.value);

let originalSize=(selectedFile.size/1024).toFixed(2);
let compressedSize=((compressedData.length*3/4)/1024).toFixed(2);
let reduction=((1-(compressedSize/originalSize))*100).toFixed(1);

document.getElementById("originalSize").textContent=originalSize+" KB";
document.getElementById("compressedSize").textContent=compressedSize+" KB";
document.getElementById("reduction").textContent=reduction+"%";

document.getElementById("previewImage").src=compressedData;

let downloadLink=document.getElementById("downloadLink");
downloadLink.href=compressedData;
downloadLink.download="compressed-image.jpg";
downloadLink.style.display="inline-block";

document.getElementById("resultBox").style.display="block";

compressBtn.disabled=false;
compressBtn.textContent="Compress Image";

}
}

}
</script>

</body>
</html>
