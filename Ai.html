<body>

<nav>
<a href="index.html">Home</a>
<a href="help.html">Help</a>
<a href="compressor.html">Compressor</a>
<a href="resizer.html">Resizer</a>

<section class="hero">
<h1>Advanced AI Assistant</h1>
<div id="aiStatus" class="status">● Online</div>
</section>

<div class="wrapper">
<div class="card">

<div class="chat" id="chat">
<div class="msg bot">
Hi 👋 I’m your Pro Assistant. Ask anything about compression, resizing or formats.
</div>
</div>

<div class="suggestions">
<span onclick="quick('How to compress image?')">Compress</span>
<span onclick="quick('Best compression quality?')">Best quality</span>
<span onclick="quick('Resize image properly')">Resize</span>
<span onclick="quick('JPG vs PNG difference')">Format</span>
</div>

<div class="input-box">
<input type="text" id="input" placeholder="Ask your question...">
<button onclick="send()">Send</button>
</div>

</div>
</div>

<footer>
© 2026 Pro Image Tools — Built with ❤️ by Soham
</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const status=document.getElementById("aiStatus");

function quick(text){
input.value=text;
send();
}

function send(){
let text=input.value.trim();
if(!text) return;

add(text,"user");
input.value="";
status.innerText="● Thinking...";
status.style.color="#f59e0b";

let typing=document.createElement("div");
typing.className="msg bot typing";
typing.innerText="Analyzing...";
chat.appendChild(typing);
chat.scrollTop=chat.scrollHeight;

setTimeout(()=>{
chat.removeChild(typing);
let reply=generate(text.toLowerCase());
add(reply,"bot");
status.innerText="● Online";
status.style.color="#16a34a";
},900);
}

function add(text,type){
let div=document.createElement("div");
div.className="msg "+type;
div.innerHTML=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function generate(input){

if(input.includes("compress")){
return `
<div class="badge">Compression</div>
Use quality 0.6–0.8 for best balance.
<div class="links">
Tool → <a href="compressor.html">Open Compressor</a><br>
Guide → <a href="help.html">Help Page</a>
</div>`;
}

if(input.includes("resize")){
return `
<div class="badge">Resize</div>
Enter width & height and maintain aspect ratio.
<div class="links">
Tool → <a href="resizer.html">Open Resizer</a>
</div>`;
}

if(input.includes("jpg") || input.includes("png") || input.includes("difference")){
return `
<div class="badge">Format</div>
JPG = smaller for photos.<br>
PNG = supports transparency.
<div class="links">
Tool → <a href="jpg-to-png.html">Open Converter</a>
</div>`;
}

if(input.includes("why") || input.length>120){
return `
<div class="badge">Detailed Guide</div>
This needs structured explanation.
<div class="links">
Read → <a href="help.html">Help & Support</a>
</div>`;
}

return `
I can help with compression, resizing and formats.
<div class="links">
Visit → <a href="help.html">Help Page</a>
</div>`;
}
</script>
