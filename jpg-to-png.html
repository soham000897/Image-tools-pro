<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPG to PNG Converter</title>
  <style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body{
background: linear-gradient(135deg,#eef2f7,#d9e2ec);
color:#1f2937;
min-height:100vh;
display:flex;
flex-direction:column;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:#0f172a;
color:white;
}

.logo{
font-size:20px;
font-weight:600;
letter-spacing:0.5px;
}

.nav-links a{
color:#cbd5e1;
margin-left:20px;
text-decoration:none;
font-size:14px;
transition:0.3s;
}

.nav-links a:hover{
color:white;
}

.container{
max-width:1100px;
margin:60px auto;
padding:20px;
}

.card{
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
transition:0.3s;
}

.card:hover{

}

.button{
display:inline-block;
margin-top:15px;

  </style>
</head>
<body style="font-family:Arial;text-align:center;padding:30px;background:#f4f6f9;">

<nav style="background:#243b55;padding:15px;">
<a href="index.html" style="color:white;text-decoration:none;">← Back to Home</a>
</nav>

<h2>JPG ↔ PNG Converter</h2>

<input type="file" id="file" accept="image/*"><br>
<button onclick="convert()">Convert to PNG</button>

<img id="preview" style="max-width:100%;margin-top:15px;">

<script>
function convert(){
let file=document.getElementById("file").files[0];
if(!file){alert("Upload image first");return;}

let reader=new FileReader();
reader.readAsDataURL(file);
reader.onload=function(e){
let img=new Image();
img.src=e.target.result;
img.onload=function(){
let canvas=document.createElement("canvas");
canvas.width=img.width;
canvas.height=img.height;
let ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0);
document.getElementById("preview").src=
canvas.toDataURL("image/png");
}
}
}
</script>

</body>
</html>
