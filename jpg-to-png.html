<section class="hero">
<h1>JPG to PNG Converter</h1>
<p>Convert your JPG images to PNG instantly — fully private and browser-based.</p>
</section>

<div class="container">

<div class="upload-box" id="uploadBox">
Click or Drag & Drop Image Here
<input type="file" id="fileInput" accept="image/*">
</div>

<button id="convertBtn" onclick="convertImage()">Convert to PNG</button>

<div class="result" id="resultBox">
<p><strong>Original Size:</strong> <span id="originalSize"></span></p>
<p><strong>Converted Size:</strong> <span id="convertedSize"></span></p>
<div class="preview">
<img id="previewImage">
</div>
<a id="downloadLink" class="download">Download PNG Image</a>
</div>

</div>

<footer>
© 2026 Pro Image Tools — Secure • Fast • Professional
</footer>

<script>
const uploadBox=document.getElementById("uploadBox");
const fileInput=document.getElementById("fileInput");
const convertBtn=document.getElementById("convertBtn");
let selectedFile;

uploadBox.addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",(e)=>{
selectedFile=e.target.files[0];
});

uploadBox.addEventListener("dragover",(e)=>{
e.preventDefault();
uploadBox.classList.add("active");
});

uploadBox.addEventListener("dragleave",()=>{
uploadBox.classList.remove("active");
});

uploadBox.addEventListener("drop",(e)=>{
e.preventDefault();
selectedFile=e.dataTransfer.files[0];
uploadBox.classList.remove("active");
});

function convertImage(){

if(!selectedFile){
alert("Please upload an image first!");
return;
}

convertBtn.disabled=true;
convertBtn.textContent="Processing...";

let reader=new FileReader();
reader.readAsDataURL(selectedFile);

reader.onload=function(e){
let img=new Image();
img.src=e.target.result;

img.onload=function(){

let canvas=document.createElement("canvas");
canvas.width=img.width;
canvas.height=img.height;

let ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0);

let pngData=canvas.toDataURL("image/png");

let originalSize=(selectedFile.size/1024).toFixed(2);
let convertedSize=((pngData.length*3/4)/1024).toFixed(2);

document.getElementById("originalSize").textContent=originalSize+" KB";
document.getElementById("convertedSize").textContent=convertedSize+" KB";

document.getElementById("previewImage").src=pngData;

let downloadLink=document.getElementById("downloadLink");
downloadLink.href=pngData;
downloadLink.download="converted-image.png";
downloadLink.style.display="inline-block";

document.getElementById("resultBox").style.display="block";

convertBtn.disabled=false;
convertBtn.textContent="Convert to PNG";

}
}

}
</script>
