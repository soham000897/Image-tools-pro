<section class="hero">
<h1>JPG to PNG Converter</h1>
<p>Convert your JPG images to PNG format instantly and securely.</p>
</section>

<div class="container">

<input type="file" id="file" accept="image/*">
<br>
<button onclick="convertImage()">Convert to PNG</button>

<div class="preview">
<img id="previewImage">
<a id="downloadLink" class="download">Download PNG Image</a>
</div>

</div>

<footer>
© 2026 Pro Image Tools — Secure • Fast • Professional
</footer>

<script>
function convertImage(){
let file=document.getElementById("file").files[0];
if(!file){alert("Please upload an image first!");return;}

let reader=new FileReader();
reader.readAsDataURL(file);
reader.onload=function(e){
let img=new Image();
img.src=e.target.result;
img.onload=function(){
let canvas=document.createElement("canvas");
canvas.width=img.width;
canvas.height=img.height;
let ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0);
let pngData=canvas.toDataURL("image/png");

document.getElementById("previewImage").src=pngData;

let downloadLink=document.getElementById("downloadLink");
downloadLink.href=pngData;
downloadLink.download="converted-image.png";
downloadLink.style.display="inline-block";
}
}
}
</script>
