<nav>

<section class="hero">
<h1>Image Resizer</h1>
<p>Resize image width and height instantly — fully browser-based and secure.</p>
</section>

<div class="container">

<div class="upload-box" id="uploadBox">
Click or Drag & Drop Image Here
<input type="file" id="fileInput" accept="image/*">
</div>

<div class="dimension-inputs">
<input type="number" id="widthInput" placeholder="Width (px)">
<input type="number" id="heightInput" placeholder="Height (px)">
</div>

<button id="resizeBtn" onclick="resizeImage()">Resize Image</button>

<div class="result" id="resultBox">
<p><strong>New Dimensions:</strong> <span id="newSize"></span></p>
<div class="preview">
<img id="outputImage">
</div>
</div>

</div>

<footer>
© 2026 Pro Image Tools — Secure • Fast • Professional
</footer>

<script>
const uploadBox=document.getElementById("uploadBox");
const fileInput=document.getElementById("fileInput");
const resizeBtn=document.getElementById("resizeBtn");

let selectedFile;

uploadBox.addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",(e)=>{
selectedFile=e.target.files[0];
});

uploadBox.addEventListener("dragover",(e)=>{
e.preventDefault();
uploadBox.classList.add("active");
});

uploadBox.addEventListener("dragleave",()=>{
uploadBox.classList.remove("active");
});

uploadBox.addEventListener("drop",(e)=>{
e.preventDefault();
selectedFile=e.dataTransfer.files[0];
uploadBox.classList.remove("active");
});

function resizeImage(){

if(!selectedFile){
alert("Please upload an image first!");
return;
}

let width=document.getElementById("widthInput").value;
let height=document.getElementById("heightInput").value;

if(!width || !height){
alert("Enter width and height.");
return;
}

resizeBtn.disabled=true;
resizeBtn.textContent="Processing...";

let reader=new FileReader();
reader.readAsDataURL(selectedFile);

reader.onload=function(e){
let img=new Image();
img.src=e.target.result;

img.onload=function(){

let canvas=document.createElement("canvas");
canvas.width=width;
canvas.height=height;

let ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,width,height);

let resizedData=canvas.toDataURL("image/jpeg");

document.getElementById("outputImage").src=resizedData;
document.getElementById("newSize").textContent=width+" x "+height+" px";

document.getElementById("resultBox").style.display="block";

resizeBtn.disabled=false;
resizeBtn.textContent="Resize Image";

}
}

}
</script>

</body>
