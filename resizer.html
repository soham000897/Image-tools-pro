<style>
*{

box-sizing:border-box;
font-family:'Segoe UI',system-ui,-apple-system,sans-serif;

/* HERO */
.hero{

padding:60px 20px 30px 20px;

.hero h1{

}

.hero p{

/* TOOL CONTAINER */
.container{

<body>

<nav>
<a href="index.html">Home</a>

</nav>

<section class="hero">
<h1>Image Resizer</h1>
<p>Resize image width and height instantly inside your browser.</p>
</section>

<div class="container">

<input type="file" id="upload" accept="image/*"><br>
<input type="number" id="width" placeholder="Width (px)">
<input type="number" id="height" placeholder="Height (px)">
<br>
<button onclick="resizeImage()">Resize Image</button>

<div class="preview">
<img id="output">
</div>

</div>

<footer>
© 2026 Pro Image Tools — Secure • Fast • Professional
</footer>

<script>
function resizeImage(){
let file=document.getElementById("upload").files[0];
if(!file){alert("Please upload an image first!");return;}

let width=document.getElementById("width").value;
let height=document.getElementById("height").value;

if(!width || !height){
alert("Please enter width and height.");
return;
}

let reader=new FileReader();
reader.readAsDataURL(file);
reader.onload=function(e){
let img=new Image();
img.src=e.target.result;
img.onload=function(){
let canvas=document.createElement("canvas");
canvas.width=width;
canvas.height=height;
let ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,width,height);
document.getElementById("output").src=
canvas.toDataURL("image/jpeg");
}
}
}
</script>

</body>
