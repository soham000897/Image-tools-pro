<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free online image compressor tool. Reduce image size instantly without losing quality. Fast, secure and mobile friendly.">
<meta name="keywords" content="image compressor, reduce image size, compress jpg online, image optimizer">
<title>Pro Image Compressor | Free Online Tool</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:#fff;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
}

/* HEADER */
header{
width:100%;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
background:rgba(0,0,0,0.2);
}

/* MAIN CARD */
.container{
background:#fff;
color:#333;
margin-top:30px;
padding:30px;
border-radius:15px;
width:95%;
max-width:550px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
animation:fadeIn 0.8s ease-in-out;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

h1{
margin-bottom:15px;
color:#243b55;
}

.drop-area{
border:2px dashed #243b55;
padding:25px;
border-radius:12px;
cursor:pointer;
margin-bottom:15px;
transition:0.3s;
font-size:14px;
}

.drop-area:hover{
background:#f2f2f2;
}

input[type="file"]{
display:none;
}

.slider-container{
margin:15px 0;
}

input[type="range"]{
width:100%;
}

button{
margin-top:10px;
padding:12px 25px;
border:none;
border-radius:8px;
background:#243b55;
color:#fff;
cursor:pointer;
font-size:15px;
transition:0.3s;
}

button:hover{
background:#0f2027;
}

.preview img{
max-width:100%;
border-radius:8px;
margin-top:15px;
}

.download{
display:none;
margin-top:10px;
background:#243b55;
color:#fff;
padding:8px 12px;
border-radius:6px;
text-decoration:none;
}

.info{
margin-top:10px;
font-size:14px;
color:#444;
}

/* AD SPACE */
.ad-space{
margin-top:25px;
padding:15px;
background:#eee;
color:#555;
border-radius:8px;
font-size:14px;
}

/* FOOTER */
footer{
margin-top:auto;
padding:15px;
font-size:13px;
opacity:0.8;
}
</style>
</head>

<body>

<header>
Pro Image Compressor Tool
</header>

<div class="container">
<h1>Compress Your Image Instantly</h1>

<div class="drop-area" id="dropArea">
Click or Drag & Drop Image Here
<input type="file" id="imageInput" accept="image/*">
</div>

<div class="slider-container">
Compression Quality: <span id="qualityValue">0.7</span>
<input type="range" id="qualitySlider" min="0.1" max="1" step="0.1" value="0.7">
</div>

<button onclick="compressImage()">Compress Now</button>

<div class="info" id="sizeInfo"></div>

<div class="preview">
<img id="previewImage">
<a id="downloadLink" class="download">Download Compressed Image</a>
</div>

<div class="ad-space">
Ad Space (Google AdSense Code Here)
</div>

</div>

<footer>
© 2026 Pro Image Compressor | Fast • Secure • Free
</footer>

<script>
const dropArea = document.getElementById("dropArea");
const fileInput = document.getElementById("imageInput");
const slider = document.getElementById("qualitySlider");
const qualityValue = document.getElementById("qualityValue");

let selectedFile;

dropArea.addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",(e)=>{
selectedFile = e.target.files[0];
});

dropArea.addEventListener("dragover",(e)=>{
e.preventDefault();
dropArea.style.background="#e6e6e6";
});

dropArea.addEventListener("dragleave",()=>{
dropArea.style.background="";
});

dropArea.addEventListener("drop",(e)=>{
e.preventDefault();
selectedFile = e.dataTransfer.files[0];
dropArea.style.background="";
});

slider.addEventListener("input",()=>{
qualityValue.textContent = slider.value;
});

function compressImage(){
if(!selectedFile){ alert("Please upload an image first!"); return; }

let reader = new FileReader();
reader.readAsDataURL(selectedFile);

reader.onload = function(event){
let img = new Image();
img.src = event.target.result;

img.onload = function(){
let canvas = document.createElement("canvas");
let ctx = canvas.getContext("2d");

canvas.width = img.width;
canvas.height = img.height;
ctx.drawImage(img,0,0);

let compressedData = canvas.toDataURL("image/jpeg", slider.value);

document.getElementById("previewImage").src = compressedData;

let downloadLink = document.getElementById("downloadLink");
downloadLink.href = compressedData;
downloadLink.download = "compressed-image.jpg";
downloadLink.style.display = "inline-block";

let originalSize = (selectedFile.size/1024).toFixed(2);
let compressedSize = ((compressedData.length*3/4)/1024).toFixed(2);

document.getElementById("sizeInfo").innerHTML =
"Original: " + originalSize + " KB | Compressed: " + compressedSize + " KB";
}
}
}
</script>

</body>
</html>
